<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>swipe-card test harness</title>
<style>
  body { background: #111; color: #eee; font-family: sans-serif; margin: 0; padding: 16px; }
  h2 { font-size: 14px; margin: 24px 0 8px; color: #9ad; }
  .case { max-width: 420px; border: 1px dashed #333; padding: 8px; margin-bottom: 8px; }
  #results { position: sticky; top: 0; background: #000; padding: 8px; z-index: 10; border-bottom: 2px solid #333; max-height: 40vh; overflow: auto; }
  .pass { color: #6f6; }
  .fail { color: #f66; font-weight: bold; }
  #summary { font-size: 16px; font-weight: bold; }
</style>
</head>
<body>
<div id="results"><div id="summary">running…</div><div id="details"></div></div>
<div id="stage"></div>

<script>
// The harness may run in a hidden/background tab where requestAnimationFrame
// never fires; Swiper's slideToLoop defers through rAF, so make it
// deterministic for the tests.
window.requestAnimationFrame = (cb) => window.setTimeout(() => cb(performance.now()), 16);
</script>
<script type="module">
import { createMockHass } from "./mock-hass.js";
import "../dist/swipe-card.js";

const stage = document.getElementById("stage");
const details = document.getElementById("details");
const summaryEl = document.getElementById("summary");
const results = [];
window.__testResults = results;
window.__testsDone = false;

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function report(name, ok, info = "") {
  results.push({ name, ok, info });
  const div = document.createElement("div");
  div.className = ok ? "pass" : "fail";
  div.textContent = `${ok ? "PASS" : "FAIL"} — ${name}${info ? " — " + info : ""}`;
  details.appendChild(div);
}

async function makeCard(config, { hass, label } = {}) {
  const h2 = document.createElement("h2");
  h2.textContent = label || JSON.stringify(config).slice(0, 120);
  stage.appendChild(h2);
  const wrap = document.createElement("div");
  wrap.className = "case";
  stage.appendChild(wrap);
  const el = document.createElement("swipe-card");
  el.setConfig(config);
  el.hass = hass || createMockHass();
  wrap.appendChild(el);
  await el.updateComplete;
  // wait for card build + swiper init (cards resolve async, template wait, etc)
  for (let i = 0; i < 80 && !el.swiper; i++) await sleep(50);
  return el;
}

const cards3 = [
  { type: "markdown", title: "one", test_height: 80 },
  { type: "markdown", title: "two", test_height: 120 },
  { type: "markdown", title: "three", test_height: 80 },
];

async function run() {
  /* 1. basic init */
  try {
    const el = await makeCard({ cards: cards3 }, { label: "basic" });
    report("basic: swiper initializes", Boolean(el.swiper));
    report("basic: 3 slides", el.swiper?.slides?.length === 3, `got ${el.swiper?.slides?.length}`);
    report("basic: starts at 0", el.swiper?.activeIndex === 0, `got ${el.swiper?.activeIndex}`);
    const slide = el.swiper?.slides?.[0];
    report("basic: slide is mock-card", slide?.localName === "mock-card", slide?.localName);
    report("basic: dir ltr", el.shadowRoot.querySelector(".swiper").getAttribute("dir") === "ltr");
  } catch (e) { report("basic", false, String(e)); }

  /* 2. start_card number */
  try {
    const el = await makeCard({ cards: cards3, start_card: 2 }, { label: "start_card: 2" });
    report("start_card=2 → index 1", el.swiper?.activeIndex === 1, `got ${el.swiper?.activeIndex}`);
  } catch (e) { report("start_card number", false, String(e)); }

  /* 3. start_card negative */
  try {
    const el = await makeCard({ cards: cards3, start_card: -1 }, { label: "start_card: -1" });
    report("start_card=-1 → last index 2", el.swiper?.activeIndex === 2, `got ${el.swiper?.activeIndex}`);
  } catch (e) { report("start_card negative", false, String(e)); }

  /* 4. start_card out of range clamps */
  try {
    const el = await makeCard({ cards: cards3, start_card: 99 }, { label: "start_card: 99" });
    report("start_card=99 clamps to 2", el.swiper?.activeIndex === 2, `got ${el.swiper?.activeIndex}`);
  } catch (e) { report("start_card clamp", false, String(e)); }

  /* 5. start_card template: initial + live update */
  try {
    const tpl = "{{ 3 if is_state('binary_sensor.x','on') else 1 }}";
    window.__templateResults[tpl] = 3;
    const before = window.__templateSubscribeCalls;
    const el = await makeCard({ cards: cards3, start_card: tpl }, { label: "start_card template" });
    report("template: subscribed", window.__templateSubscribeCalls === before + 1);
    report("template: starts at index 2", el.swiper?.activeIndex === 2, `got ${el.swiper?.activeIndex}`);
    window.__templateResults[tpl] = 1;
    window.__pushTemplateUpdates();
    await sleep(600);
    report("template: live update slides to 0", el.swiper?.activeIndex === 0, `got ${el.swiper?.activeIndex}`);
    // disconnect → unsubscribes
    const unsubBefore = window.__templateUnsubscribeCalls;
    el.remove();
    await sleep(100);
    report("template: unsubscribes on disconnect", window.__templateUnsubscribeCalls === unsubBefore + 1);
  } catch (e) { report("start_card template", false, String(e)); }

  /* 6. template with no result registered (subscribe works, never resolves) → timeout fallback */
  try {
    const tpl = "{{ states('sensor.never') }}";
    const t0 = performance.now();
    const el = await makeCard({ cards: cards3, start_card: tpl }, { label: "template no-result timeout" });
    const dt = performance.now() - t0;
    report("template timeout: falls back to index 0", el.swiper?.activeIndex === 0, `after ${Math.round(dt)}ms`);
  } catch (e) { report("template timeout", false, String(e)); }

  /* 7. reset_after returns to start card */
  try {
    const el = await makeCard({ cards: cards3, start_card: 2, reset_after: 1 }, { label: "reset_after" });
    el.swiper.slideTo(0);
    el.swiper.emit("touchEnd");
    await sleep(1600);
    report("reset_after: returns to start index 1", el.swiper?.activeIndex === 1, `got ${el.swiper?.activeIndex}`);
  } catch (e) { report("reset_after", false, String(e)); }

  /* 8. pagination + navigation render */
  try {
    const el = await makeCard(
      { cards: cards3, parameters: { pagination: null, navigation: null } },
      { label: "pagination + navigation" }
    );
    const sr = el.shadowRoot;
    report("pagination el rendered + bound",
      Boolean(sr.querySelector(".swiper-pagination")) && el.swiper?.params?.pagination?.el instanceof HTMLElement);
    report("navigation els rendered + bound",
      Boolean(sr.querySelector(".swiper-button-next")) && el.swiper?.params?.navigation?.nextEl instanceof HTMLElement);
    const bullets = sr.querySelectorAll(".swiper-pagination-bullet").length;
    report("pagination bullets = 3", bullets === 3, `got ${bullets}`);
  } catch (e) { report("pagination/navigation", false, String(e)); }

  /* 9. v6 parameter migration */
  try {
    const el = await makeCard(
      { cards: cards3, parameters: { slidesPerColumn: 2, freeModeMomentum: false, watchSlidesVisibility: true, loopedSlides: 2, preloadImages: true } },
      { label: "v6 params migration" }
    );
    const p = el.swiper?.params;
    report("v6: slidesPerColumn → grid.rows", p?.grid?.rows === 2, JSON.stringify(p?.grid));
    report("v6: freeModeMomentum → freeMode.momentum", p?.freeMode?.momentum === false);
    report("v6: watchSlidesVisibility → watchSlidesProgress", p?.watchSlidesProgress === true);
    report("v6: loopedSlides → loopAdditionalSlides", p?.loopAdditionalSlides === 2);
    report("v6: preloadImages dropped", !("preloadImages" in (el._parameters || {})));
  } catch (e) { report("v6 migration", false, String(e)); }

  /* 10. prototype pollution guard */
  try {
    const evil = JSON.parse('{"cards":[{"type":"markdown","title":"x"}],"parameters":{"__proto__":{"polluted":true},"speed":300}}');
    const el = await makeCard(evil, { label: "proto pollution guard" });
    report("pollution: Object.prototype clean", !("polluted" in {}), String(({}).polluted));
    report("pollution: legit param kept", el.swiper?.params?.speed === 300);
  } catch (e) { report("pollution guard", false, String(e)); }

  /* 11. RTL */
  try {
    const hass = createMockHass({ language: "he" });
    const el = await makeCard({ cards: cards3 }, { hass, label: "RTL hebrew" });
    report("rtl: dir=rtl", el.shadowRoot.querySelector(".swiper").getAttribute("dir") === "rtl");
  } catch (e) { report("rtl", false, String(e)); }

  /* 12. unknown selectedLanguage doesn't crash */
  try {
    const hass = createMockHass({ selectedLanguage: "xx-not-there" });
    const el = await makeCard({ cards: cards3 }, { hass, label: "unknown language guard" });
    report("unknown lang: renders", Boolean(el.swiper));
  } catch (e) { report("unknown lang", false, String(e)); }

  /* 13. card_width */
  try {
    const el = await makeCard(
      { cards: cards3, card_width: "200px", parameters: { slidesPerView: "auto" } },
      { label: "card_width" }
    );
    const w = el.swiper?.slides?.[0]?.getBoundingClientRect()?.width;
    report("card_width applied", Math.round(w) === 200, `got ${w}px`);
  } catch (e) { report("card_width", false, String(e)); }

  /* 14. getCardSize + getGridOptions */
  try {
    const el = await makeCard({ cards: cards3 }, { label: "sizes" });
    const size = await el.getCardSize();
    report("getCardSize = max child (3)", size === 3, `got ${size}`);
    const grid = el.getGridOptions();
    report("getGridOptions shape", grid && grid.columns === 12 && grid.rows === "auto", JSON.stringify(grid));
  } catch (e) { report("sizes", false, String(e)); }

  /* 15. reconfigure (setConfig twice) — single swiper, no leak */
  try {
    const el = await makeCard({ cards: cards3 }, { label: "reconfigure" });
    const first = el.swiper;
    el.setConfig({ cards: cards3.slice(0, 2), start_card: 2 });
    await el.updateComplete;
    for (let i = 0; i < 80 && (!el.swiper || el.swiper === first); i++) await sleep(50);
    report("reconfig: new swiper instance", el.swiper && el.swiper !== first);
    report("reconfig: 2 slides", el.swiper?.slides?.length === 2, `got ${el.swiper?.slides?.length}`);
    report("reconfig: honors new start_card", el.swiper?.activeIndex === 1, `got ${el.swiper?.activeIndex}`);
    report("reconfig: old swiper destroyed", first.destroyed === true, `destroyed=${first.destroyed}`);
  } catch (e) { report("reconfigure", false, String(e)); }

  /* 16. reset_after via template */
  try {
    const tpl = "{{ 1 if is_state('input_boolean.fast','on') else 60 }}";
    window.__templateResults[tpl] = 1;
    const el = await makeCard({ cards: cards3, start_card: 3, reset_after: tpl }, { label: "reset_after template" });
    await sleep(200); // let template result land
    el.swiper.slideTo(0);
    el.swiper.emit("touchEnd");
    await sleep(1700);
    report("reset_after template: returns to start index 2", el.swiper?.activeIndex === 2, `got ${el.swiper?.activeIndex}`);
  } catch (e) { report("reset_after template", false, String(e)); }

  /* R1. pagination/navigation false must not crash (v14 accepts false) */
  try {
    const el = await makeCard(
      { cards: cards3, parameters: { pagination: false, navigation: false } },
      { label: "pagination:false" }
    );
    report("pagination:false: swiper inits", Boolean(el.swiper));
    report("pagination:false: no pagination div", !el.shadowRoot.querySelector(".swiper-pagination"));
  } catch (e) { report("pagination:false", false, String(e)); }

  /* R2. scalar parameters must not crash */
  try {
    const el = await makeCard(
      { cards: cards3, parameters: "effect coverflow" },
      { label: "scalar parameters" }
    );
    report("scalar parameters ignored, card works", Boolean(el.swiper) && el.swiper.slides.length === 3);
  } catch (e) { report("scalar parameters", false, String(e)); }

  /* R3. user-supplied initialSlide honored when start_card absent */
  try {
    const el = await makeCard(
      { cards: cards3, parameters: { initialSlide: 2 } },
      { label: "native initialSlide" }
    );
    report("native initialSlide honored", el.swiper?.activeIndex === 2, `got ${el.swiper?.activeIndex}`);
  } catch (e) { report("native initialSlide", false, String(e)); }

  /* R4. detach destroys swiper (deferred), reattach re-inits and resumes position */
  try {
    const el = await makeCard({ cards: cards3 }, { label: "detach/reattach" });
    const first = el.swiper;
    el.swiper.slideTo(2);
    await sleep(100);
    const parent = el.parentElement;
    el.remove();
    await sleep(150); // deferred destroy fires
    report("detach: swiper destroyed", first.destroyed === true, `destroyed=${first.destroyed}`);
    parent.appendChild(el);
    for (let i = 0; i < 80 && (!el.swiper || el.swiper === first); i++) await sleep(50);
    report("reattach: new swiper created", Boolean(el.swiper) && el.swiper !== first);
    report("reattach: resumes at slide 2", el.swiper?.activeIndex === 2, `got ${el.swiper?.activeIndex}`);
  } catch (e) { report("detach/reattach", false, String(e)); }

  /* R5. unchanged template re-delivery must not yank the user back */
  try {
    const tpl = "{{ states('sensor.startslide') }}";
    window.__templateResults[tpl] = 1;
    const el = await makeCard({ cards: cards3, start_card: tpl }, { label: "template no-yank" });
    report("no-yank: starts at 0", el.swiper?.activeIndex === 0, `got ${el.swiper?.activeIndex}`);
    el.swiper.slideTo(2);
    await sleep(100);
    window.__pushTemplateUpdates(); // same value re-delivered
    await sleep(300);
    report("no-yank: stays at 2 on unchanged result", el.swiper?.activeIndex === 2, `got ${el.swiper?.activeIndex}`);
    window.__templateResults[tpl] = 2;
    window.__pushTemplateUpdates(); // changed value → should move
    await sleep(400);
    report("no-yank: moves on changed result", el.swiper?.activeIndex === 1, `got ${el.swiper?.activeIndex}`);
  } catch (e) { report("template no-yank", false, String(e)); }

  /* R6. loop mode: template update uses logical index (slideToLoop) */
  try {
    const tpl = "{{ states('sensor.loopslide') }}";
    window.__templateResults[tpl] = 1;
    const el = await makeCard(
      { cards: cards3, start_card: tpl, parameters: { loop: true } },
      { label: "loop + template" }
    );
    window.__templateResults[tpl] = 3;
    window.__pushTemplateUpdates();
    await sleep(500);
    report("loop: realIndex follows logical slide", el.swiper?.realIndex === 2, `realIndex=${el.swiper?.realIndex}`);
  } catch (e) { report("loop + template", false, String(e)); }

  /* R7. failing template is latched, not retried on every hass set */
  try {
    const el = await makeCard({ cards: cards3, start_card: "{{ broken" }, { label: "template latch" });
    await sleep(300);
    const callsAfterInit = window.__templateSubscribeCalls;
    el.hass = createMockHass();
    el.hass = createMockHass();
    await sleep(300);
    report("failed template not resubscribed on hass updates",
      window.__templateSubscribeCalls === callsAfterInit, `calls ${callsAfterInit} -> ${window.__templateSubscribeCalls}`);
  } catch (e) { report("template latch", false, String(e)); }

  /* R8. card_width via CSS var still applies */
  try {
    const el = await makeCard(
      { cards: cards3, card_width: "180px", parameters: { slidesPerView: "auto" } },
      { label: "card_width css var" }
    );
    const w = el.swiper?.slides?.[0]?.getBoundingClientRect()?.width;
    report("card_width css var applied", Math.round(w) === 180, `got ${w}px`);
    report("css var set on host", el.style.getPropertyValue("--swipe-card-width") === "180px");
  } catch (e) { report("card_width css var", false, String(e)); }

  /* R9. intrinsic width containment: the card must not blow out
     content-sized containers (layout-card grid columns, width:max-content) */
  try {
    const h2 = document.createElement("h2");
    h2.textContent = "intrinsic width containment";
    stage.appendChild(h2);
    const outer = document.createElement("div");
    outer.className = "case";
    outer.style.cssText = "display:grid;grid-template-columns:auto;justify-content:start;max-width:400px;";
    const el = document.createElement("swipe-card");
    el.setConfig({ cards: [
      { type: "markdown", title: "w1", test_height: 60 },
      { type: "markdown", title: "w2", test_height: 60 },
      { type: "markdown", title: "w3", test_height: 60 },
      { type: "markdown", title: "w4", test_height: 60 }
    ] });
    el.hass = createMockHass();
    outer.appendChild(el);
    stage.appendChild(outer);
    for (let i = 0; i < 60 && !el.swiper; i++) await sleep(50);
    await sleep(200);
    const w = Math.round(el.getBoundingClientRect().width);
    report("containment: card does not exceed container", w <= 400, `card width ${w}px`);
    report("containment: no slide-sum blowout", outer.scrollWidth <= 420, `scrollWidth ${outer.scrollWidth}px (blowout would be 1600+)`);
  } catch (e) { report("intrinsic width containment", false, String(e)); }

  /* 17. empty cards config doesn't crash */
  try {
    const el = await makeCard({ cards: [] }, { label: "empty cards" });
    report("empty cards: swiper inits with 0 slides", Boolean(el.swiper) && el.swiper.slides.length === 0);
    const size = await el.getCardSize();
    report("empty cards: getCardSize = 1", size === 1, `got ${size}`);
  } catch (e) { report("empty cards", false, String(e)); }

  const failed = results.filter((r) => !r.ok);
  summaryEl.textContent = `${results.length - failed.length}/${results.length} passed${failed.length ? " — " + failed.length + " FAILED" : ""}`;
  summaryEl.className = failed.length ? "fail" : "pass";
  window.__testsDone = true;
}

run();
</script>
</body>
</html>
